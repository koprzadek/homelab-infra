apiVersion: apps/v1
kind: Deployment
metadata:
  name: valheim-server
  labels:
    app: valheim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valheim
  template:
    metadata:
      labels:
        app: valheim
    spec:
      containers:
      - name: valheim
        image: docker.io/lloesche/valheim-server:latest
        ports:
        - containerPort: 2456
          protocol: UDP
        - containerPort: 2457
          protocol: UDP
        env:
        - name: SERVER_NAME
          value: "My Valheim Server"
        - name: WORLD_NAME
          value: "Dedicated"
        - name: SERVER_PASS
          value: "sejsmograf"
        volumeMounts:
        - mountPath: /config
          name: gamefiles
        - mountPath: /opt/valheim
          name: serverfiles
      volumes:
        - hostPath: 
            path: /data/valheim
            type: DirectoryOrCreate
          name: gamefiles
        - hostPath:
            path: /data/valheim-server
            type: DirectoryOrCreate
          name: serverfiles

---
apiVersion: v1
kind: Service
metadata:
  name: valheim-service
spec:
  type: NodePort
  selector:
    app: valheim
  ports:
  - name: valheim-udp-1
    protocol: UDP
    port: 2456
    targetPort: 2456
    nodePort: 30373
  - name: valheim-udp-2
    protocol: UDP
    port: 2457
    targetPort: 2457
    nodePort: 30374
